[project]
name = "assembly-world-bench"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=1.0,<2", "numpy==2.5.3", "scipy==1.18.1",
  "pillow>=11", "mujoco==3.12.0", "jsonschema>=4.26,<5",
  "playwright==1.62.0", "python-dotenv>=1.2,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.12"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
